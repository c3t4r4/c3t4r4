name: GitHub Metrics

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Stats gerais
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/github-metrics.svg
          base: header, activity, community, repositories
          config_timezone: America/Sao_Paulo

      - name: Calendário isométrico
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/github-isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: America/Sao_Paulo

  generate-langs:
    needs: generate-metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Gerar SVG de linguagens (Dracula theme)
        run: python .github/scripts/generate-langs-svg.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/github-langs.svg
          if git diff --staged --quiet; then
            echo "Sem alteracoes para commitar."
            exit 0
          fi
          git commit -m "chore: atualizar linguagens [Skip GitHub Action]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Push concluido."
              exit 0
            fi
            echo "Tentativa $i falhou; aguardando..."
            sleep $((i * 5))
          done
          echo "Falha ao enviar apos 3 tentativas."
          exit 1

  generate-snake:
    needs: generate-langs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - run: mkdir -p assets

      - name: Snake dark/light
        uses: Platane/snk@v3
        with:
          github_user_name: c3t4r4
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit snake
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --staged --quiet; then
            echo "Sem alteracoes para commitar."
            exit 0
          fi
          git commit -m "chore: atualizar animação snake [Skip GitHub Action]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Push concluido."
              exit 0
            fi
            echo "Tentativa $i falhou; aguardando..."
            sleep $((i * 5))
          done
          echo "Falha ao enviar apos 3 tentativas."
          exit 1
