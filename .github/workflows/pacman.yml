name: Generate pacman animation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Salvar SVGs em assets/
        run: |
          mkdir -p assets
          cp dist/pacman-contribution-graph.svg assets/pacman-contribution-graph.svg
          cp dist/pacman-contribution-graph-dark.svg assets/pacman-contribution-graph-dark.svg

      - name: Commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/pacman-contribution-graph.svg assets/pacman-contribution-graph-dark.svg
          if git diff --staged --quiet; then
            echo "Sem alteracoes para commitar."
            exit 0
          fi
          git commit -m "chore: atualizar animação pacman [Skip GitHub Action]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Push concluido."
              exit 0
            fi
            echo "Tentativa $i falhou; aguardando..."
            sleep $((i * 5))
          done
          echo "Falha ao enviar apos 3 tentativas."
          exit 1
